- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'
- id: project-members-memory
  name: './memory-membership.ts'
- id: member-question-sender
  name: './memory-member-question.ts'
- id: tool-project-members
  name: '@deepseek-ai/dsh-tool-project-members'
  config:
    currentAccountResolver: !!js "async () => 'acc-demo-owner'"
    boundProjectResolver: !!js "async () => 'proj-demo'"
    rosterPresenter: !!js "async view => view.members.map((member, index) => ({ presence: index === 0 ? 'online' : 'offline', displayName: index === 0 ? 'Demo Owner' : 'grace' }))"
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  config:
    boundProjectResolver: !!js "async () => 'proj-demo'"
    routeResolver: !!js "async ({ toProjectMember }) => toProjectMember.toLowerCase() === 'grace' ? ({ projectId: 'proj-demo', toProjectMember: 'acc-demo-dev', origin: { projectName: 'demo', originSessionTitle: 'Project member decision', askerAccountId: 'acc-demo-owner', askerRole: 'owner', askerDisplayName: 'Demo Owner', askerAvatarUrl: 'https://avatars.example/demo-owner.png' } }) : undefined"
- id: session-title-llm
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: project-members-mock
            name: Project Members Replay
            models:
              - id: project-members-mock
