# Validate Environment production, then optionally pull a published image onto both ECS hosts.
name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy (sha-... or latest)
        required: true
        type: string
        default: latest
      deploy:
        description: Apply the image on both ECS hosts
        required: true
        type: boolean
        default: false
      attachment_storage:
        description: Deploy the PostgreSQL atomic bridge first; enable OSS only in a later completed deployment
        required: true
        type: choice
        options:
          - postgres
          - oss
        default: postgres

concurrency:
  group: platform-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate production Environment
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fail on missing production names
        env:
          PLATFORM_ENVIRONMENT: production
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CLIENT_SECRET: ${{ secrets.PLATFORM_GITHUB_CLIENT_SECRET }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_HOST: ${{ vars.PLATFORM_POSTGRES_HOST }}
          PLATFORM_POSTGRES_USER: ${{ secrets.PLATFORM_POSTGRES_USER }}
          PLATFORM_POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          PLATFORM_REDIS_HOST: ${{ vars.PLATFORM_REDIS_HOST }}
          PLATFORM_REDIS_USER: ${{ secrets.PLATFORM_REDIS_USER }}
          PLATFORM_REDIS_PASSWORD: ${{ secrets.PLATFORM_REDIS_PASSWORD }}
          PLATFORM_OSS_ENDPOINT: ${{ vars.PLATFORM_OSS_ENDPOINT }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_OSS_AUTH: ${{ vars.PLATFORM_OSS_AUTH }}
          PLATFORM_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_OSS_OBJECT_PREFIX }}
          PLATFORM_OSS_TIMEOUT_MS: '10000'
          PLATFORM_RELAY_REDIS_KEY_PREFIX: ${{ vars.PLATFORM_RELAY_REDIS_KEY_PREFIX }}
          PLATFORM_RELAY_INSTANCE_ID: relay-validation
          PLATFORM_RELAY_CAPACITY_RETRY_AFTER_MS: '1000'
          PLATFORM_RELAY_DELIVERY_ACK_TIMEOUT_MS: '5000'
          PLATFORM_RELAY_DIRECTORY_TTL_MS: '60000'
          PLATFORM_RELAY_HEARTBEAT_TIMEOUT_MS: '45000'
          PLATFORM_RELAY_MAX_BUFFERED_CIPHERTEXT_BYTES: '1048576'
          PLATFORM_RELAY_MAX_CONNECTIONS: '10000'
          PLATFORM_RELAY_MAX_PENDING_DELIVERIES: '10000'
          PLATFORM_RELAY_MAX_PENDING_CHALLENGES: '10000'
          PLATFORM_RELAY_ATTACH_TIMEOUT_MS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_BLOB_BYTES: '104857600'
          PLATFORM_REMOTE_ATTACHMENT_CAPABILITY_LIFETIME_MS: '900000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_RETAINED_BLOBS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_STORAGE: ${{ inputs.attachment_storage }}
          PLATFORM_REMOTE_ATTACHMENT_SWEEP_INTERVAL_MS: '60000'
          PLATFORM_REMOTE_ATTACHMENT_CLEANUP_CONCURRENCY: '8'
          PLATFORM_TOKEN_SIGNING_KEY: ${{ secrets.PLATFORM_TOKEN_SIGNING_KEY }}
          PLATFORM_POLLING_SIGNING_KEY: ${{ secrets.PLATFORM_POLLING_SIGNING_KEY }}
          PLATFORM_ECS_SSH_KEY: ${{ secrets.PLATFORM_ECS_SSH_KEY }}
          PLATFORM_ECS_HOSTS: ${{ vars.PLATFORM_ECS_HOSTS }}
        run: node --import tsx/esm apps/platform/src/production-env-cli.ts

  deploy:
    name: Deploy to ECS
    needs: validate
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and save image
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}/platform" | tr '[:upper:]' '[:lower:]'):${TAG}"
          docker pull "$image"
          docker save "$image" | gzip > /tmp/platform.tar.gz
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Install Docker and run on ECS
        env:
          SSH_KEY: ${{ secrets.PLATFORM_ECS_SSH_KEY }}
          HOSTS: ${{ vars.PLATFORM_ECS_HOSTS }}
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CLIENT_SECRET: ${{ secrets.PLATFORM_GITHUB_CLIENT_SECRET }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_HOST: ${{ vars.PLATFORM_POSTGRES_HOST }}
          PLATFORM_POSTGRES_USER: ${{ secrets.PLATFORM_POSTGRES_USER }}
          PLATFORM_POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          PLATFORM_REDIS_HOST: ${{ vars.PLATFORM_REDIS_HOST }}
          PLATFORM_REDIS_USER: ${{ secrets.PLATFORM_REDIS_USER }}
          PLATFORM_REDIS_PASSWORD: ${{ secrets.PLATFORM_REDIS_PASSWORD }}
          PLATFORM_OSS_ENDPOINT: ${{ vars.PLATFORM_OSS_ENDPOINT }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_OSS_AUTH: ${{ vars.PLATFORM_OSS_AUTH }}
          PLATFORM_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_OSS_OBJECT_PREFIX }}
          PLATFORM_OSS_TIMEOUT_MS: '10000'
          PLATFORM_RELAY_REDIS_KEY_PREFIX: ${{ vars.PLATFORM_RELAY_REDIS_KEY_PREFIX }}
          PLATFORM_REDIS_TLS: '1'
          PLATFORM_TOKEN_SIGNING_KEY: ${{ secrets.PLATFORM_TOKEN_SIGNING_KEY }}
          PLATFORM_POLLING_SIGNING_KEY: ${{ secrets.PLATFORM_POLLING_SIGNING_KEY }}
          PLATFORM_SLS_ACCOUNT_ID: ${{ vars.PLATFORM_SLS_ACCOUNT_ID }}
          PLATFORM_REMOTE_ATTACHMENT_STORAGE: ${{ inputs.attachment_storage }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/ecs.pem
          printf '%s\n' "$SSH_KEY" > /tmp/ecs.pem
          IFS=',' read -r -a hosts <<< "$HOSTS"
          for host in "${hosts[@]}"; do
            host="${host// /}"
            relay_instance="relay-${host//./-}"
            echo "expand ${host}"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              'dnf -y install docker >/dev/null 2>&1 || yum -y install docker >/dev/null 2>&1; systemctl enable --now docker'
            gzip -dc /tmp/platform.tar.gz | ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" 'docker load'
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              "set -euo pipefail; if [ $(printf %q "$PLATFORM_REMOTE_ATTACHMENT_STORAGE") = oss ]; then docker run --rm --network host \
                -e PLATFORM_OSS_ENDPOINT=$(printf %q "$PLATFORM_OSS_ENDPOINT") \
                -e PLATFORM_OSS_BUCKET=$(printf %q "$PLATFORM_OSS_BUCKET") \
                -e PLATFORM_OSS_AUTH=$(printf %q "$PLATFORM_OSS_AUTH") \
                -e PLATFORM_OSS_OBJECT_PREFIX=$(printf %q "$PLATFORM_OSS_OBJECT_PREFIX") \
                -e PLATFORM_OSS_TIMEOUT_MS=$(printf %q "$PLATFORM_OSS_TIMEOUT_MS") \
                ${IMAGE} node dist/oss-lifecycle-cli.mjs; fi; \
               docker rm -f dsh-platform-candidate >/dev/null 2>&1 || true; docker run -d --name dsh-platform-candidate --restart no \
                --log-driver json-file --log-opt max-size=20m --log-opt max-file=3 \
                -p 127.0.0.1:18080:8080 \
                -e PLATFORM_ENVIRONMENT=production \
                -e PLATFORM_ORIGIN=$(printf %q "$PLATFORM_ORIGIN") \
                -e PLATFORM_GITHUB_CALLBACK=$(printf %q "$PLATFORM_GITHUB_CALLBACK") \
                -e PLATFORM_GITHUB_CLIENT_ID=$(printf %q "$PLATFORM_GITHUB_CLIENT_ID") \
                -e PLATFORM_GITHUB_CLIENT_SECRET=$(printf %q "$PLATFORM_GITHUB_CLIENT_SECRET") \
                -e PLATFORM_GITHUB_CREDENTIAL_REFERENCE=$(printf %q "$PLATFORM_GITHUB_CREDENTIAL_REFERENCE") \
                -e PLATFORM_POSTGRES_HOST=$(printf %q "$PLATFORM_POSTGRES_HOST") \
                -e PLATFORM_POSTGRES_USER=$(printf %q "$PLATFORM_POSTGRES_USER") \
                -e PLATFORM_POSTGRES_PASSWORD=$(printf %q "$PLATFORM_POSTGRES_PASSWORD") \
                -e PLATFORM_POSTGRES_SSL=require \
                -e PLATFORM_POSTGRES_DATABASE=$(printf %q "$PLATFORM_POSTGRES_DATABASE") \
                -e PLATFORM_IDENTITY_NAMESPACE=$(printf %q "$PLATFORM_IDENTITY_NAMESPACE") \
                -e PLATFORM_REDIS_HOST=$(printf %q "$PLATFORM_REDIS_HOST") \
                -e PLATFORM_REDIS_USER=$(printf %q "$PLATFORM_REDIS_USER") \
                -e PLATFORM_REDIS_PASSWORD=$(printf %q "$PLATFORM_REDIS_PASSWORD") \
                -e PLATFORM_OSS_ENDPOINT=$(printf %q "$PLATFORM_OSS_ENDPOINT") \
                -e PLATFORM_OSS_BUCKET=$(printf %q "$PLATFORM_OSS_BUCKET") \
                -e PLATFORM_OSS_AUTH=$(printf %q "$PLATFORM_OSS_AUTH") \
                -e PLATFORM_OSS_OBJECT_PREFIX=$(printf %q "$PLATFORM_OSS_OBJECT_PREFIX") \
                -e PLATFORM_OSS_TIMEOUT_MS=10000 \
                -e PLATFORM_RELAY_REDIS_KEY_PREFIX=$(printf %q "$PLATFORM_RELAY_REDIS_KEY_PREFIX") \
                -e PLATFORM_REDIS_TLS=1 \
                -e PLATFORM_RELAY_INSTANCE_ID=$(printf %q "$relay_instance") \
                -e PLATFORM_RELAY_CAPACITY_RETRY_AFTER_MS=1000 \
                -e PLATFORM_RELAY_DELIVERY_ACK_TIMEOUT_MS=5000 \
                -e PLATFORM_RELAY_DIRECTORY_TTL_MS=60000 \
                -e PLATFORM_RELAY_HEARTBEAT_TIMEOUT_MS=45000 \
                -e PLATFORM_RELAY_MAX_BUFFERED_CIPHERTEXT_BYTES=1048576 \
                -e PLATFORM_RELAY_MAX_CONNECTIONS=10000 \
                -e PLATFORM_RELAY_MAX_PENDING_DELIVERIES=10000 \
                -e PLATFORM_RELAY_MAX_PENDING_CHALLENGES=10000 \
                -e PLATFORM_RELAY_ATTACH_TIMEOUT_MS=10000 \
                -e PLATFORM_REMOTE_ATTACHMENT_MAX_BLOB_BYTES=104857600 \
                -e PLATFORM_REMOTE_ATTACHMENT_CAPABILITY_LIFETIME_MS=900000 \
                -e PLATFORM_REMOTE_ATTACHMENT_MAX_RETAINED_BLOBS=10000 \
                -e PLATFORM_REMOTE_ATTACHMENT_STORAGE=$(printf %q "$PLATFORM_REMOTE_ATTACHMENT_STORAGE") \
                -e PLATFORM_REMOTE_ATTACHMENT_SWEEP_INTERVAL_MS=60000 \
                -e PLATFORM_REMOTE_ATTACHMENT_CLEANUP_CONCURRENCY=8 \
                -e PLATFORM_TOKEN_SIGNING_KEY=$(printf %q "$PLATFORM_TOKEN_SIGNING_KEY") \
                -e PLATFORM_POLLING_SIGNING_KEY=$(printf %q "$PLATFORM_POLLING_SIGNING_KEY") \
                ${IMAGE}; \
               ready=0; for attempt in \$(seq 1 30); do \
                 if body=\$(curl -fsS --max-time 2 http://127.0.0.1:18080/readyz) \
                   && printf '%s' \"\$body\" | grep -Fq '\"attachmentStorage\":\"'$(printf %q "$PLATFORM_REMOTE_ATTACHMENT_STORAGE")'\"'; then ready=1; break; fi; sleep 1; \
               done; test \"\$ready\" = 1; \
               install -m 600 /dev/null /run/dsh-platform-candidate.env; \
               docker inspect dsh-platform-candidate --format '{{range .Config.Env}}{{println .}}{{end}}' > /run/dsh-platform-candidate.env"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              "set -euo pipefail
               token=\$(curl -fsS --max-time 5 -X PUT http://100.100.100.200/latest/api/token -H 'X-aliyun-ecs-metadata-token-ttl-seconds:60' || true)
               account=
               if [ -n \"\$token\" ]; then
                 account=\$(curl -fsS --max-time 5 -H \"X-aliyun-ecs-metadata-token: \$token\" http://100.100.100.200/latest/meta-data/owner-account-id || true)
               fi
               account=\${account:-$(printf %q "${PLATFORM_SLS_ACCOUNT_ID:-}")}
               test -n \"\$account\"
               docker rm -f dsh-loongcollector >/dev/null 2>&1 || true
               docker pull aliyun-observability-release-registry.cn-hangzhou.cr.aliyuncs.com/loongcollector/loongcollector:v3.0.12.0-25723a1-aliyun
               docker run -d --name dsh-loongcollector --restart unless-stopped \\
                 -v /:/logtail_host:ro \\
                 -v /var/run/docker.sock:/var/run/docker.sock \\
                 --env ALIYUN_LOGTAIL_CONFIG=/etc/ilogtail/conf/cn-hangzhou/ilogtail_config.json \\
                 --env ALIYUN_LOGTAIL_USER_ID=\"\$account\" \\
                 --env ALIYUN_LOGTAIL_USER_DEFINED_ID=gestalt-platform \\
                 aliyun-observability-release-registry.cn-hangzhou.cr.aliyuncs.com/loongcollector/loongcollector:v3.0.12.0-25723a1-aliyun"
          done

          for host in "${hosts[@]}"; do
            host="${host// /}"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              'set -euo pipefail; docker inspect dsh-platform >/dev/null; curl -fsS --max-time 5 http://127.0.0.1:80/readyz >/dev/null'
          done
          if [ "$PLATFORM_REMOTE_ATTACHMENT_STORAGE" = oss ]; then
            for host in "${hosts[@]}"; do
              host="${host// /}"
              ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
                "set -euo pipefail; body=\$(curl -fsS --max-time 5 http://127.0.0.1:80/readyz); \
                 printf '%s' \"\$body\" | grep -Fq '\"attachmentStorage\":\"postgres\"'"
            done
          fi

          rollback_platform() {
            set +e
            for rollback_host in "${hosts[@]}"; do
              rollback_host="${rollback_host// /}"
              ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${rollback_host}" \
                "if docker inspect dsh-platform-rollback >/dev/null 2>&1; then \
                   docker rm -f dsh-platform >/dev/null 2>&1 || true; \
                   docker rename dsh-platform-rollback dsh-platform && docker start dsh-platform; \
                 fi; docker rm -f dsh-platform-candidate >/dev/null 2>&1 || true; \
                 rm -f /run/dsh-platform-candidate.env" || true
            done
          }
          trap rollback_platform ERR

          # Contract begins only after every candidate is ready. Stop every predecessor before
          # any replacement receives product traffic, so inspect-write-revoke and atomic consumers never overlap.
          for host in "${hosts[@]}"; do
            host="${host// /}"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              "set -euo pipefail; docker rm -f dsh-platform-rollback >/dev/null 2>&1 || true; \
               if docker inspect dsh-platform >/dev/null 2>&1; then \
                 docker rename dsh-platform dsh-platform-rollback; docker stop dsh-platform-rollback; \
               fi"
          done

          for host in "${hosts[@]}"; do
            host="${host// /}"
            echo "contract ${host}"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              "set -euo pipefail; docker rm -f dsh-platform-candidate >/dev/null; \
               docker run -d --name dsh-platform --restart unless-stopped \
                 --log-driver json-file --log-opt max-size=20m --log-opt max-file=3 \
                 -p 80:8080 --env-file /run/dsh-platform-candidate.env ${IMAGE}; \
               ready=0; for attempt in \$(seq 1 30); do \
                 if body=\$(curl -fsS --max-time 2 http://127.0.0.1:80/readyz) \
                   && printf '%s' \"\$body\" | grep -Fq '\"attachmentStorage\":\"'$(printf %q "$PLATFORM_REMOTE_ATTACHMENT_STORAGE")'\"'; then ready=1; break; fi; sleep 1; \
               done; test \"\$ready\" = 1"
          done

          for host in "${hosts[@]}"; do
            host="${host// /}"
            ssh -i /tmp/ecs.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${host}" \
              'docker rm -f dsh-platform-rollback >/dev/null 2>&1 || true; rm -f /run/dsh-platform-candidate.env'
          done
          trap - ERR
          rm -f /tmp/ecs.pem /tmp/platform.tar.gz
