name: CI master

on:
  push:
    branches: [master]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Manual CI suite to run
        required: true
        default: larger-runner-benchmark
        type: choice
        options:
          - larger-runner-benchmark
          - consolidated-runner-benchmark
          - standby-exhaustive

# A master push carries only two bounded self-hosted standby smokes and the Wine
# apt cache seeder, so push runs do not cancel one another. Daily exhaustive
# drills and re-dispatched manual benchmarks may replace a stale non-push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # The standby runners keep machine-level pnpm configuration across jobs.
  # Product tests require the platform payloads declared as optional dependencies,
  # so the repository workflow must override any host-level optional=false setting.
  PNPM_CONFIG_OPTIONAL: 'true'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Master seeds the Wine apt-archive cache in the default-branch scope,
  # which every pull request's windows job can restore; saves from
  # pull-request runs are scoped to their own merge ref and help nobody
  # else. Runs in seconds when the image version already has a cache.
  wine-apt-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: wine apt cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compose Wine apt cache key
        id: wine-cache-key
        run: echo "key=wine-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: wine-cache
        with:
          path: ~/wine-debs
          key: ${{ steps.wine-cache-key.outputs.key }}

      - name: Download the Wine dependency closure
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only wine
          mkdir -p "$HOME/wine-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/wine-debs/"
          du -sh "$HOME/wine-debs"

  standby-linux-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: standby smoke / linux (self-hosted)
    runs-on: [self-hosted, linux, x64, vm-backup]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild workspace state
        run: git clean -ffdx

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent content-addressed pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile --force

      - name: Run bounded Linux failover smoke
        env:
          DSH_CI_REPORT_PATH: ${{ runner.temp }}/ci-evidence/standby-linux-smoke.json
          DSH_CI_ARTIFACT_REFS: standby-linux-smoke
          DSH_GATE_CONCURRENCY: '2'
        run: pnpm run check:ci:standby-linux-smoke

      - name: Publish Linux failover readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standby-linux-smoke
          path: ${{ runner.temp }}/ci-evidence/standby-linux-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report Linux failover switch
        if: always()
        run: echo 'Linux takeover uses DSH_CI_FAILOVER_LINUX=selfhosted; see standby-linux-smoke artifact.' >> "$GITHUB_STEP_SUMMARY"

  standby-windows-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: standby smoke / windows (self-hosted)
    runs-on: [self-hosted, dsh-win-ci, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild workspace state
        shell: pwsh
        run: git clean -ffdx

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent content-addressed pnpm store
        shell: pwsh
        run: |
          $storeRoot = "$env:LOCALAPPDATA\pnpm\store"
          echo "PNPM_CONFIG_STORE_DIR=$storeRoot" >> $env:GITHUB_ENV

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile --force

      - name: Run bounded Windows failover smoke
        shell: pwsh
        env:
          DSH_CI_REPORT_PATH: ${{ runner.temp }}/ci-evidence/standby-windows-smoke.json
          DSH_CI_ARTIFACT_REFS: standby-windows-smoke
          DSH_GATE_CONCURRENCY: '2'
        run: pnpm run check:ci:standby-windows-smoke

      - name: Publish Windows failover readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standby-windows-smoke
          path: ${{ runner.temp }}/ci-evidence/standby-windows-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report Windows failover switch
        if: always()
        shell: pwsh
        run: echo 'Windows takeover uses DSH_CI_FAILOVER_WINDOWS=selfhosted; see standby-windows-smoke artifact.' >> $env:GITHUB_STEP_SUMMARY

  # Daily/manual complete Linux reference for the persistent standby pool.
  # Failures are readiness evidence, not product regressions. Promotion to a
  # required PR lane remains the explicit DSH_CI_FAILOVER_LINUX=selfhosted
  # switch in ci.yml. The runner keeps its content-addressed store outside the
  # checkout while every drill rebuilds node_modules from a clean workspace.
  standby-linux-exhaustive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'standby-exhaustive')
    name: standby exhaustive / linux (self-hosted)
    runs-on: [self-hosted, linux, x64, vm-backup]
    timeout-minutes: 120
    steps:
      # DSH_ARCHIVE_BASE_REF below compares the frozen-archive gate with HEAD^;
      # full history keeps that reference available on scheduled and manual
      # runs. Checkout resolves against the VM's local mirror.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild workspace state
        run: git clean -ffdx

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile --force

      # The persistent VM image owns Playwright's Linux system packages; this
      # step also proves that browser provisioning remains usable for failover.
      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_CI_FAILURE_CLASSIFICATION: failover-readiness
          DSH_CI_REPORT_PATH: ${{ runner.temp }}/ci-evidence/standby-linux-exhaustive.json
          DSH_CI_ARTIFACT_REFS: standby-linux-exhaustive
          DSH_ARCHIVE_BASE_REF: HEAD^
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_OXLINT_THREADS: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci:linux-primary

      - name: Publish exhaustive Linux failover readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standby-linux-exhaustive
          path: ${{ runner.temp }}/ci-evidence/standby-linux-exhaustive.json
          if-no-files-found: warn
          retention-days: 30

  # TODO(hosted-serial-ci): Re-enable the remaining disabled hosted macOS serial
  # reference job before release. Hosted Linux and Windows dependency caches
  # are produced independently by ci-cache-producer.yml.
  serial-macos:
    if: false
    name: serial / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci

  # Daily/manual complete Windows reference for the persistent standby pool.
  # Promotion to a required native PR lane remains the explicit
  # DSH_CI_FAILOVER_WINDOWS=selfhosted switch in ci.yml. The runner keeps its
  # content-addressed store outside the checkout while every drill rebuilds
  # node_modules from a clean workspace.
  standby-windows-exhaustive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'standby-exhaustive')
    name: standby exhaustive / windows (self-hosted)
    runs-on: [self-hosted, dsh-win-ci, windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild workspace state
        shell: pwsh
        run: git clean -ffdx

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        shell: pwsh
        run: |
          $storeRoot = "$env:LOCALAPPDATA\pnpm\store"
          echo "PNPM_CONFIG_STORE_DIR=$storeRoot" >> $env:GITHUB_ENV

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile --force

      - name: Run complete unsharded Windows gate inventory serially
        shell: pwsh
        env:
          DSH_CI_FAILURE_CLASSIFICATION: failover-readiness
          DSH_CI_REPORT_PATH: ${{ runner.temp }}/ci-evidence/standby-windows-exhaustive.json
          DSH_CI_ARTIFACT_REFS: standby-windows-exhaustive
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
        run: pnpm run check:ci:windows-complete

      - name: Publish exhaustive Windows failover readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standby-windows-exhaustive
          path: ${{ runner.temp }}/ci-evidence/standby-windows-exhaustive.json
          if-no-files-found: warn
          retention-days: 30

  # Manual, bounded comparison of the actual critical Linux and Windows lanes.
  # The named pools are restricted at the organization level to this repository.
  larger-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'larger-runner-benchmark'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: dsh-ubuntu-24-04-4core
            workload: typecheck
          - platform: linux
            cores: '8'
            runner: dsh-ubuntu-24-04-8core
            workload: typecheck
          - platform: linux
            cores: '16'
            runner: dsh-ubuntu-24-04-16core
            workload: typecheck
          - platform: linux
            cores: '32'
            runner: dsh-ubuntu-24-04-32core
            workload: typecheck
          - platform: linux
            cores: '64'
            runner: dsh-ubuntu-24-04-64core
            workload: typecheck
          - platform: linux
            cores: '96'
            runner: dsh-ubuntu-24-04-96core
            workload: typecheck
          - platform: windows
            cores: '4'
            runner: dsh-windows-2025-4core
            workload: production-site
          - platform: windows
            cores: '8'
            runner: dsh-windows-2025-8core
            workload: production-site
          - platform: windows
            cores: '16'
            runner: dsh-windows-2025-16core
            workload: production-site
          - platform: windows
            cores: '32'
            runner: dsh-windows-2025-32core
            workload: production-site
          - platform: windows
            cores: '64'
            runner: dsh-windows-2025-64core
            workload: production-site
          - platform: windows
            cores: '96'
            runner: dsh-windows-2025-96core
            workload: production-site
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # The benchmark's Windows lanes deliberately skip the store cache like
      # the independent native Windows job; an empty input disables caching.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: ${{ matrix.platform == 'linux' && 'pnpm' || '' }}

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run critical Linux typecheck lane
        if: matrix.platform == 'linux'
        run: pnpm run typecheck

      - name: Run critical Windows production-site lane
        if: matrix.platform == 'windows'
        run: pnpm run docs:build

  # Manual comparison of the intended low-fanout topology. Linux runs the
  # complete unsharded primary aggregate with bounded in-runner parallelism;
  # Windows runs both blocking build targets concurrently through run-gates.
  consolidated-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'consolidated-runner-benchmark'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: dsh-ubuntu-24-04-4core
            workers: '4'
          - platform: linux
            cores: '8'
            runner: dsh-ubuntu-24-04-8core
            workers: '8'
          - platform: linux
            cores: '16'
            runner: dsh-ubuntu-24-04-16core
            workers: '16'
          - platform: linux
            cores: '32'
            runner: dsh-ubuntu-24-04-32core
            workers: '32'
          - platform: linux
            cores: '64'
            runner: dsh-ubuntu-24-04-64core
            workers: '32'
          - platform: linux
            cores: '96'
            runner: dsh-ubuntu-24-04-96core
            workers: '32'
          - platform: windows
            cores: '4'
            runner: dsh-windows-2025-4core
            workers: '2'
          - platform: windows
            cores: '8'
            runner: dsh-windows-2025-8core
            workers: '2'
          - platform: windows
            cores: '16'
            runner: dsh-windows-2025-16core
            workers: '2'
          - platform: windows
            cores: '32'
            runner: dsh-windows-2025-32core
            workers: '2'
          - platform: windows
            cores: '64'
            runner: dsh-windows-2025-64core
            workers: '2'
          - platform: windows
            cores: '96'
            runner: dsh-windows-2025-96core
            workers: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Unlike the larger-runner suite, both platforms cache the store here:
      # the consolidated topology measures cache mechanics as workload.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install and prepare Linux
        if: matrix.platform == 'linux'
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install (immutable)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI concurrently
        if: matrix.platform == 'linux'
        env:
          DSH_COVERAGE_MAX_WORKERS: ${{ matrix.workers }}
          DSH_GATE_CONCURRENCY: ${{ matrix.workers }}
          DSH_OXLINT_THREADS: ${{ matrix.workers }}
          DSH_PUBLINT_CONCURRENCY: ${{ matrix.workers }}
          DSH_SNAPSHOT_MAX_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci

      - name: Run blocking Windows builds concurrently
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DSH_GATE_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci:windows-blocking
