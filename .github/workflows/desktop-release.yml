# Pack DeepSeek Gestalt installers and publish a GitHub Release for electron-updater.
# A publish dispatch from master creates its gestalt-v* tag after every packaged smoke passes.
name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop Bundle version from apps/desktop/package.json.
        required: true
        type: string
        default: '0.1.0'
      publish:
        description: Create the gestalt-v* tag and GitHub Release after packaging succeeds.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: node apps/desktop/scripts/prepare-release.mjs "$INPUT_VERSION" "$PUBLISH" "$GITHUB_REF_NAME"

  pack-mac:
    name: Pack macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
    environment:
      name: ${{ inputs.publish && 'desktop-release' || 'desktop-dry-run' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Validate release credentials
        if: inputs.publish
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "desktop-release environment is missing secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Electron cookie-isolation e2e
        run: pnpm run test:electron-runtime-e2e

      - name: Project operated Platform identity
        env:
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
        run: node apps/desktop/scripts/write-operated-platform-config.mjs "$DSH_DESKTOP_OPERATED_PLATFORM_CONFIG"

      - name: Build
        run: |
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-desktop build:main

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform darwin --arch ${{ matrix.arch }}

      - name: Deploy dsh snapshot
        run: |
          pnpm --ignore-scripts --config.node-linker=hoisted --config.inject-workspace-packages=true \
            --filter @deepseek-ai/dsh deploy --prod apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package unsigned
        if: ${{ !inputs.publish }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node_modules/.bin/electron-builder \
            --mac --${{ matrix.arch }} --publish never \
            -c.mac.identity=null -c.mac.notarize=false

      - name: Package signed and notarized
        if: inputs.publish
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          hard_open_files=$(ulimit -Hn)
          ulimit -n "$hard_open_files"
          echo "open-file limit: $(ulimit -Sn)"
          node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true

      - name: Verify signed app
        if: inputs.publish
        run: |
          app_bundle=$(find apps/desktop/release -name 'DeepSeek Gestalt.app' -type d -print -quit)
          test -n "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          xcrun stapler validate "$app_bundle"

      - name: Smoke packaged Desktop Host
        run: |
          app_bin=$(find apps/desktop/release -path '*/DeepSeek Gestalt.app/Contents/MacOS/DeepSeek Gestalt' -type f -print -quit)
          test -n "$app_bin"
          DSH_DESKTOP_SMOKE=1 DSH_PACKAGED_APP_BIN="$app_bin" node_modules/.bin/vitest run apps/desktop/tests/electron-smoke-packaged.spec.ts

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-mac-${{ matrix.arch }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  pack-win:
    name: Pack Windows x64
    needs: prepare
    runs-on: windows-2025
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
    environment:
      name: ${{ inputs.publish && 'desktop-release' || 'desktop-dry-run' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Electron cookie-isolation e2e
        run: pnpm run test:electron-runtime-e2e

      - name: Project operated Platform identity
        env:
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
        run: node apps/desktop/scripts/write-operated-platform-config.mjs "$env:DSH_DESKTOP_OPERATED_PLATFORM_CONFIG"

      - name: Build
        run: |
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-desktop build:main

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform win32 --arch x64

      - name: Deploy dsh snapshot
        run: |
          pnpm --ignore-scripts --config.node-linker=hoisted --config.inject-workspace-packages=true `
            --filter @deepseek-ai/dsh deploy --prod apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package
        working-directory: apps/desktop
        run: |
          if ('${{ inputs.publish }}' -eq 'true') {
            $compression = 'normal'
          } else {
            $compression = 'store'
          }
          & node_modules/.bin/electron-builder.cmd --win --x64 --publish never "-c.compression=$compression"

      - name: Verify packaged icon
        shell: pwsh
        run: |
          $appBin = Get-ChildItem apps/desktop/release -Recurse -Filter 'DeepSeek Gestalt.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $appBin) { throw 'packaged executable not found' }
          & node apps/desktop/scripts/verify-windows-icon.mjs $appBin apps/desktop/build/icon.ico

      - name: Smoke packaged Desktop Host
        shell: pwsh
        run: |
          $appBin = Get-ChildItem apps/desktop/release -Recurse -Filter 'DeepSeek Gestalt.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $appBin) { throw 'packaged executable not found' }
          $env:DSH_DESKTOP_SMOKE = '1'
          $env:DSH_PACKAGED_APP_BIN = $appBin
          & node_modules/.bin/vitest.cmd run apps/desktop/tests/electron-smoke-packaged.spec.ts

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-win-x64
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    if: inputs.publish
    needs: [prepare, pack-mac, pack-win]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge macOS update feeds
        run: node apps/desktop/scripts/merge-latest-mac.mjs dist

      - name: Render release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/desktop-release-notes.md
        run: node apps/desktop/scripts/render-release-notes.mjs "$RELEASE_VERSION" "$GITHUB_SHA" "$RELEASE_NOTES_FILE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/desktop-release-notes.md
        run: |
          set -Eeuo pipefail
          tag=${{ needs.prepare.outputs.tag }}
          mapfile -t assets < <(node apps/desktop/scripts/release-assets.mjs dist "$RELEASE_VERSION")
          tag_owned=false
          release_owned=false
          published=false
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [[ "$published" == 'true' ]]; then
              exit "$status"
            fi
            if [[ "$release_owned" == 'true' ]]; then
              gh release delete "$tag" --yes >/dev/null 2>&1 || true
            fi
            if [[ "$tag_owned" == 'true' ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$tag" \
            --field sha="$GITHUB_SHA" >/dev/null
          tag_owned=true
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Gestalt ${{ needs.prepare.outputs.version }}" \
            --notes-file "$RELEASE_NOTES_FILE"
          release_owned=true
          gh release upload "$tag" "${assets[@]}"
          local_names=$(printf '%s\n' "${assets[@]##*/}" | sort)
          remote_names=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$local_names" != "$remote_names" ]]; then
            echo 'uploaded release assets do not match the validated candidate'
            diff <(printf '%s\n' "$local_names") <(printf '%s\n' "$remote_names") || true
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest
          published=true
          trap - EXIT INT TERM
