# Pack DeepSeek Gestalt installers and publish a GitHub Release for electron-updater.
# A publish call creates its candidate-bound gestalt-v* tag after every packaged smoke passes.
name: Desktop Release

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact Product Release Plan commit to package or publish.
        required: true
        type: string
      plan_path:
        description: Numbered Product Release Plan at the candidate commit.
        required: true
        type: string
      version:
        description: Desktop Bundle version from apps/desktop/package.json.
        required: true
        type: string
      publish:
        description: Create the gestalt-v* tag and GitHub Release after packaging succeeds.
        required: true
        type: boolean
      artifact_run_id:
        description: Prior run containing the exact signed Desktop artifacts for publication recovery.
        required: false
        type: string
        default: ''
      recover_artifacts:
        description: Promote a validated prior signed-candidate artifact without packaging again.
        required: true
        type: boolean
      sign_artifacts:
        description: Sign and notarize newly packaged artifacts even when publication is deferred.
        required: true
        type: boolean
    outputs:
      tag:
        description: Published Desktop component tag.
        value: ${{ jobs.publish.outputs.tag }}
      release_url:
        description: Published GitHub Release URL.
        value: ${{ jobs.publish.outputs.release_url }}
      artifact_digests:
        description: JSON array of promoted installer and update-feed SHA-256 values.
        value: ${{ jobs.publish.outputs.artifact_digests }}
      workflow_run:
        description: GitHub Actions run that published the Desktop release.
        value: ${{ jobs.publish.outputs.workflow_run }}
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Product Release Plan commit to package or publish.
        required: true
        type: string
      plan_path:
        description: Numbered Product Release Plan at the candidate commit.
        required: true
        type: string
      version:
        description: Desktop Bundle version from apps/desktop/package.json.
        required: true
        type: string
        default: '0.1.8'
      publish:
        description: Create the gestalt-v* tag and GitHub Release after packaging succeeds.
        required: true
        type: boolean
        default: false
      artifact_run_id:
        description: Prior run containing the exact signed Desktop artifacts; required for manual publication recovery.
        required: false
        type: string
      recover_artifacts:
        description: Promote a validated prior signed-candidate artifact without packaging again.
        required: true
        type: boolean
        default: false
      sign_artifacts:
        description: Sign and notarize newly packaged artifacts even when publication is deferred.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PLAN_PATH: ${{ inputs.plan_path }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RECOVER_ARTIFACTS: ${{ inputs.recover_artifacts }}
          SIGN_ARTIFACTS: ${{ inputs.sign_artifacts }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          jq -e --arg version "$INPUT_VERSION" \
            '.releaseUnits.desktop.selected == true and .releaseUnits.desktop.version == $version' "$PLAN_PATH" >/dev/null
          if [[ "$RECOVER_ARTIFACTS" == true && -z "$ARTIFACT_RUN_ID" ]] || [[ "$RECOVER_ARTIFACTS" != true && -n "$ARTIFACT_RUN_ID" ]]; then
            echo 'Desktop recover_artifacts and artifact_run_id must be provided together' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true && "$RECOVER_ARTIFACTS" != true && "$SIGN_ARTIFACTS" != true ]]; then
            echo 'Desktop publication requires signed artifacts' >&2
            exit 1
          fi
          node apps/desktop/scripts/prepare-release.mjs "$INPUT_VERSION" "$PUBLISH"

  pack-mac:
    name: Pack macOS ${{ matrix.arch }}
    needs: prepare
    if: ${{ !inputs.recover_artifacts }}
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    environment:
      name: ${{ inputs.sign_artifacts && 'desktop-release' || 'desktop-dry-run' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Validate release credentials
        if: inputs.sign_artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "desktop-release environment is missing secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Electron cookie-isolation e2e
        run: pnpm run test:electron-runtime-e2e

      - name: Project operated Platform identity
        env:
          DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          DESKTOP_COMPANION_ATTACHMENT_HOST_TIMEOUT_MS: ${{ vars.DESKTOP_COMPANION_ATTACHMENT_HOST_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_ATTACH_TIMEOUT_MS: ${{ vars.DESKTOP_REMOTE_RELAY_ATTACH_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_NEGOTIATION_TIMEOUT_MS: ${{ vars.DESKTOP_REMOTE_RELAY_NEGOTIATION_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS: ${{ vars.DESKTOP_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS }}
          DESKTOP_REMOTE_RELAY_RECONNECT_DELAY_MS: ${{ vars.DESKTOP_REMOTE_RELAY_RECONNECT_DELAY_MS }}
          DESKTOP_REMOTE_RELAY_INBOUND_MAX_BYTES: ${{ vars.DESKTOP_REMOTE_RELAY_INBOUND_MAX_BYTES }}
          DESKTOP_REMOTE_RELAY_INBOUND_MAX_MESSAGES: ${{ vars.DESKTOP_REMOTE_RELAY_INBOUND_MAX_MESSAGES }}
        run: node apps/desktop/scripts/write-operated-platform-config.mjs "$DSH_DESKTOP_OPERATED_PLATFORM_CONFIG"

      - name: Build
        env:
          DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
        run: |
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-desktop build:main

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform darwin --arch ${{ matrix.arch }}

      - name: Deploy dsh snapshot
        run: |
          pnpm --ignore-scripts --config.node-linker=hoisted --config.inject-workspace-packages=true \
            --filter @deepseek-ai/dsh deploy --prod apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package unsigned
        if: ${{ !inputs.sign_artifacts }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node_modules/.bin/electron-builder \
            --mac --${{ matrix.arch }} --publish never \
            -c.mac.identity=null -c.mac.notarize=false

      - name: Package signed and notarized
        if: inputs.sign_artifacts
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          hard_open_files=$(ulimit -Hn)
          ulimit -n "$hard_open_files"
          echo "open-file limit: $(ulimit -Sn)"
          node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true

      - name: Verify signed app
        if: inputs.sign_artifacts
        run: |
          app_bundle=$(find apps/desktop/release -name 'DeepSeek Gestalt.app' -type d -print -quit)
          test -n "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          xcrun stapler validate "$app_bundle"

      - name: Smoke packaged Desktop Host
        run: |
          app_bin=$(find apps/desktop/release -path '*/DeepSeek Gestalt.app/Contents/MacOS/DeepSeek Gestalt' -type f -print -quit)
          test -n "$app_bin"
          DSH_DESKTOP_SMOKE=1 DSH_PACKAGED_APP_BIN="$app_bin" node_modules/.bin/vitest run apps/desktop/tests/electron-smoke-packaged.spec.ts

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-mac-${{ matrix.arch }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  pack-win:
    name: Pack Windows x64
    needs: prepare
    if: ${{ !inputs.recover_artifacts }}
    runs-on: windows-2025
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    environment:
      name: ${{ inputs.sign_artifacts && 'desktop-release' || 'desktop-dry-run' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Electron cookie-isolation e2e
        run: pnpm run test:electron-runtime-e2e

      - name: Project operated Platform identity
        env:
          DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          DESKTOP_COMPANION_ATTACHMENT_HOST_TIMEOUT_MS: ${{ vars.DESKTOP_COMPANION_ATTACHMENT_HOST_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_ATTACH_TIMEOUT_MS: ${{ vars.DESKTOP_REMOTE_RELAY_ATTACH_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_NEGOTIATION_TIMEOUT_MS: ${{ vars.DESKTOP_REMOTE_RELAY_NEGOTIATION_TIMEOUT_MS }}
          DESKTOP_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS: ${{ vars.DESKTOP_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS }}
          DESKTOP_REMOTE_RELAY_RECONNECT_DELAY_MS: ${{ vars.DESKTOP_REMOTE_RELAY_RECONNECT_DELAY_MS }}
          DESKTOP_REMOTE_RELAY_INBOUND_MAX_BYTES: ${{ vars.DESKTOP_REMOTE_RELAY_INBOUND_MAX_BYTES }}
          DESKTOP_REMOTE_RELAY_INBOUND_MAX_MESSAGES: ${{ vars.DESKTOP_REMOTE_RELAY_INBOUND_MAX_MESSAGES }}
        run: node apps/desktop/scripts/write-operated-platform-config.mjs "$env:DSH_DESKTOP_OPERATED_PLATFORM_CONFIG"

      - name: Build
        env:
          DSH_DESKTOP_OPERATED_PLATFORM_CONFIG: ${{ runner.temp }}/operated-platform.json
        run: |
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-desktop build:main

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform win32 --arch x64

      - name: Deploy dsh snapshot
        run: |
          pnpm --ignore-scripts --config.node-linker=hoisted --config.inject-workspace-packages=true `
            --filter @deepseek-ai/dsh deploy --prod apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package
        working-directory: apps/desktop
        run: |
          if ('${{ inputs.publish }}' -eq 'true') {
            $compression = 'normal'
          } else {
            $compression = 'store'
          }
          & node_modules/.bin/electron-builder.cmd --win --x64 --publish never "-c.compression=$compression"

      - name: Verify packaged icon
        shell: pwsh
        run: |
          $appBin = Get-ChildItem apps/desktop/release -Recurse -Filter 'DeepSeek Gestalt.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $appBin) { throw 'packaged executable not found' }
          & node apps/desktop/scripts/verify-windows-icon.mjs $appBin apps/desktop/build/icon.ico

      - name: Verify Windows update feed
        run: node apps/desktop/scripts/verify-windows-update-feed.mjs apps/desktop/release ${{ needs.prepare.outputs.version }}

      - name: Smoke packaged Desktop Host
        shell: pwsh
        run: |
          $appBin = Get-ChildItem apps/desktop/release -Recurse -Filter 'DeepSeek Gestalt.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $appBin) { throw 'packaged executable not found' }
          $env:DSH_DESKTOP_SMOKE = '1'
          $env:DSH_PACKAGED_APP_BIN = $appBin
          & node_modules/.bin/vitest.cmd run apps/desktop/tests/electron-smoke-packaged.spec.ts

      - name: Smoke NSIS-installed Desktop Host
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release -File |
            Where-Object { $_.Name -like 'DeepSeekGestalt-Setup-*-x64.exe' } |
            Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found' }
          $dest = Join-Path $env:RUNNER_TEMP 'gestalt-nsis'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install exited $($install.ExitCode)" }
          $appBin = Join-Path $dest 'DeepSeek Gestalt.exe'
          if (-not (Test-Path $appBin)) { throw "installed executable not found: $appBin" }
          $env:DSH_DESKTOP_SMOKE = '1'
          $env:DSH_PACKAGED_APP_BIN = $appBin
          & node_modules/.bin/vitest.cmd run apps/desktop/tests/electron-smoke-packaged.spec.ts

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-win-x64
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  candidate-evidence:
    name: Record signed Desktop candidate
    needs: [prepare, pack-mac, pack-win]
    if: ${{ !inputs.recover_artifacts && inputs.sign_artifacts && needs.pack-mac.result == 'success' && needs.pack-win.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble signed-candidate manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          set -Eeuo pipefail
          node apps/desktop/scripts/merge-latest-mac.mjs dist
          mkdir candidate
          mapfile -t assets < <(node apps/desktop/scripts/release-assets.mjs dist "$RELEASE_VERSION")
          for asset in "${assets[@]}"; do cp "$asset" candidate/; done
          digests=$(for asset in candidate/*; do sha256sum "$asset"; done | jq -Rn \
            '[inputs | capture("^(?<digest>[0-9a-f]{64})  (?<path>.+)$") | {key:(.path | split("/") | last),value:("sha256:" + .digest)}] | from_entries')
          jq -n --arg candidate "$CANDIDATE_SHA" --arg plan "$PLAN_PATH" --arg version "$RELEASE_VERSION" --argjson digests "$digests" \
            '{version:1,surface:"desktop",candidateCommit:$candidate,planPath:$plan,productVersion:$version,artifactDigests:$digests}' \
            > candidate/release-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-candidate-${{ inputs.candidate_sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Validate prior Desktop candidate
    needs: prepare
    if: inputs.recover_artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate prior run, manifest, and downloaded digests
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PLAN_PATH: ${{ inputs.plan_path }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DESKTOP_ARTIFACT_RUN_ID" > run.json
          gh run download "$DESKTOP_ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-candidate-$CANDIDATE_SHA" --dir candidate
          digests=$(for asset in candidate/*; do
            if [[ "$(basename "$asset")" != release-candidate.json ]]; then sha256sum "$asset"; fi
          done | jq -Rn '[inputs | capture("^(?<digest>[0-9a-f]{64})  (?<path>.+)$") | {key:(.path | split("/") | last),value:("sha256:" + .digest)}] | from_entries')
          printf '%s\n' "$digests" > digests.json
          node --import tsx/esm -e '
            import { readFileSync } from "node:fs";
            import { validatePriorReleaseRun, validateReleaseArtifactManifest } from "./scripts/release/product.ts";
            const json = path => JSON.parse(readFileSync(path, "utf8"));
            validatePriorReleaseRun(json("run.json"), { repository: process.env.GITHUB_REPOSITORY, candidateCommit: process.env.CANDIDATE_SHA, allowedWorkflows: [".github/workflows/desktop-release.yml", ".github/workflows/product-release.yml"] });
            validateReleaseArtifactManifest(json("candidate/release-candidate.json"), { surface: "desktop", candidateCommit: process.env.CANDIDATE_SHA, planPath: process.env.PLAN_PATH, productVersion: process.env.RELEASE_VERSION }, json("digests.json"));'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-candidate-${{ inputs.candidate_sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release
    if: ${{ inputs.publish && always() && needs.prepare.result == 'success' && (needs.candidate-evidence.result == 'success' || needs.provenance.result == 'success') }}
    needs: [prepare, candidate-evidence, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      release_url: ${{ steps.publish.outputs.release_url }}
      artifact_digests: ${{ steps.publish.outputs.artifact_digests }}
      workflow_run: ${{ steps.publish.outputs.workflow_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-candidate-${{ inputs.candidate_sha }}
          path: dist

      - name: Render release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/desktop-release-notes.md
        run: node apps/desktop/scripts/render-release-notes.mjs "$RELEASE_VERSION" "${{ inputs.candidate_sha }}" "$RELEASE_NOTES_FILE"

      - name: Publish release
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/desktop-release-notes.md
          DESKTOP_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          tag=${{ needs.prepare.outputs.tag }}
          mapfile -t assets < <(node apps/desktop/scripts/release-assets.mjs dist "$RELEASE_VERSION")
          tag_owned=false
          release_owned=false
          published=false
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [[ "$published" == 'true' ]]; then
              exit "$status"
            fi
            if [[ "$release_owned" == 'true' ]]; then
              gh release delete "$tag" --yes >/dev/null 2>&1 || true
            fi
            if [[ "$tag_owned" == 'true' ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$tag" \
            --field sha="$DESKTOP_CANDIDATE_SHA" >/dev/null
          tag_owned=true
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --target "$DESKTOP_CANDIDATE_SHA" \
            --title "DeepSeek Gestalt ${{ needs.prepare.outputs.version }}" \
            --notes-file "$RELEASE_NOTES_FILE"
          release_owned=true
          gh release upload "$tag" "${assets[@]}"
          local_names=$(printf '%s\n' "${assets[@]##*/}" | sort)
          remote_names=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$local_names" != "$remote_names" ]]; then
            echo 'uploaded release assets do not match the validated candidate'
            diff <(printf '%s\n' "$local_names") <(printf '%s\n' "$remote_names") || true
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest
          artifact_digests=$(for asset in "${assets[@]}"; do sha256sum "$asset"; done \
            | jq -Rsc 'split("\n") | map(select(length > 0) | split(" ")[0])')
          {
            echo "tag=$tag"
            echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo "artifact_digests=$artifact_digests"
            echo "workflow_run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          published=true
          trap - EXIT INT TERM
