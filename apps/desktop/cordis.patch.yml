# Desktop-only overlay on the web profile. Browser `dsh web` does not load this file.
# `ui-phone` is not re-inserted here: the web-app roster already carries the
# row, and a second insert duplicates the loader entry id and kills startup.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-desktop
      name: '@deepseek-ai/dsh-client-ui-desktop'

# Phone fleet: Desktop always composes environment, stable fleet, stream, and
# tool Consumers. The explicit executable env remains the operator override;
# otherwise the environment selects managed current before system discovery.
- insert:
    - id: phone-runtime
      name: '@deepseek-ai/dsh-phone-runtime'
      config:
        deferStart: true
        serverPort: !!js "Number(process.env.DSH_PHONE_SERVER_PORT || 12000)"
        provisioningProfilePath: !!js process.env.DSH_PHONE_PROVISIONING_PROFILE

    - id: phone-environment
      name: '@deepseek-ai/dsh-phone-environment'
      config:
        root: !!js dshHomePath('phone')
        executablePath: !!js process.env.DSH_PHONE_MOBILECLI

    - id: phone-environment-android
      name: '@deepseek-ai/dsh-phone-environment-android'
      config:
        root: !!js dshHomePath('phone')

    - id: phone-environment-ios
      name: '@deepseek-ai/dsh-phone-environment-ios'

    - id: phone-stream
      name: '@deepseek-ai/dsh-phone-stream'

    - id: tool-phone
      name: '@deepseek-ai/dsh-tool-phone'

# DeepSeek Gestalt owns authoritative Companion search and therefore activates
# the derived full-text index in its Desktop-only layer. Browser `dsh web`
# retains the base opt-in stance.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

# The Desktop Host owns in-process Electron webContents and publishes Tandem's
# HTTP vocabulary on a loopback origin. When both Host env vars are absent
# (CI / `dsh web` / keyless Desktop snapshots), this is an intentionally
# absent runtime: keep the deterministic Provider and do not apply the HTTP
# client. If either var is present, the client mounts and a missing or
# invalid counterpart fails loud at load.
- id: browser-runtime-deterministic
  disabled: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN != null || process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE != null

- insert:
    - id: browser-runtime-electron-http
      name: '@deepseek-ai/dsh-browser-runtime-tandem'
      disabled: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN == null && process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE == null
      config:
        baseUrl: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN
        tokenFile: !!js process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE
        idPrefix: gestalt
        startupTimeoutMs: 15000
        requestTimeoutMs: 30000
        healthPollMs: 50
        pageSettleMs: 250
        reconnectAttempts: 0
        reconnectDelayMs: 500
        processGraceMs: 1000
        sidecar: false
        # Production Desktop never launches a second Electron. command/cwd stay unset.

# Desktop Host already loads the Session Surface. Replace web-runtime config so
# `openBrowser` is false even if spawn argv omits `--no-open`. Browser `dsh web`
# keeps the command default.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
