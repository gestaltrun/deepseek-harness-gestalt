# Desktop-only overlay on the web profile. Browser `dsh web` does not load this file.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-desktop
      name: '@deepseek-ai/dsh-client-ui-desktop'

# DeepSeek Gestalt owns authoritative Companion search and therefore activates
# the derived full-text index in its Desktop-only layer. Browser `dsh web`
# retains the base opt-in stance.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

# The Desktop Host owns in-process Electron webContents and publishes Tandem's
# HTTP vocabulary on a loopback origin. When both Host env vars are absent
# (CI / `dsh web` / keyless Desktop snapshots), this is an intentionally
# absent runtime: keep the deterministic Provider and do not apply the HTTP
# client. If either var is present, the client mounts and a missing or
# invalid counterpart fails loud at load.
- id: browser-runtime-deterministic
  disabled: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN != null || process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE != null

- insert:
    - id: browser-runtime-electron-http
      name: '@deepseek-ai/dsh-browser-runtime-tandem'
      disabled: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN == null && process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE == null
      config:
        baseUrl: !!js process.env.DSH_ELECTRON_BROWSER_ORIGIN
        tokenFile: !!js process.env.DSH_ELECTRON_BROWSER_TOKEN_FILE
        idPrefix: gestalt
        startupTimeoutMs: 15000
        requestTimeoutMs: 30000
        healthPollMs: 50
        pageSettleMs: 250
        reconnectAttempts: 0
        reconnectDelayMs: 500
        processGraceMs: 1000
        sidecar: false
        # Production Desktop never launches a second Electron. command/cwd stay unset.
