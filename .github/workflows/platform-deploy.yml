# Validate Environment production, then optionally deploy through Alibaba Cloud Assistant.
name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy (sha-... or latest)
        required: true
        type: string
        default: latest
      deploy:
        description: Apply the image on both ECS hosts
        required: true
        type: boolean
        default: false
      recover:
        description: Resolve an interrupted deployment from its durable phase
        required: true
        type: boolean
        default: false
      attachment_storage:
        description: Deploy the PostgreSQL atomic bridge first; enable OSS only in a later completed deployment
        required: true
        type: choice
        options:
          - postgres
          - oss
        default: postgres

concurrency:
  group: platform-deploy
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  ALIYUN_CLI_VERSION: 3.4.11
  ALIYUN_CLI_LINUX_AMD64_SHA256: a7e3df497db14c10d4d7587795e9fa7849b0c51dfce02908b9de5a41fe717d5c

jobs:
  validate:
    name: Validate production Environment
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fail on missing production names
        env:
          PLATFORM_ENVIRONMENT: production
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CLIENT_SECRET: ${{ secrets.PLATFORM_GITHUB_CLIENT_SECRET }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_HOST: ${{ vars.PLATFORM_POSTGRES_HOST }}
          PLATFORM_POSTGRES_USER: ${{ secrets.PLATFORM_POSTGRES_USER }}
          PLATFORM_POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          PLATFORM_REDIS_HOST: ${{ vars.PLATFORM_REDIS_HOST }}
          PLATFORM_REDIS_USER: ${{ secrets.PLATFORM_REDIS_USER }}
          PLATFORM_REDIS_PASSWORD: ${{ secrets.PLATFORM_REDIS_PASSWORD }}
          PLATFORM_OSS_ENDPOINT: ${{ vars.PLATFORM_OSS_ENDPOINT }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_OSS_AUTH: ${{ vars.PLATFORM_OSS_AUTH }}
          PLATFORM_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_OSS_OBJECT_PREFIX }}
          PLATFORM_OSS_TIMEOUT_MS: '10000'
          PLATFORM_RELAY_REDIS_KEY_PREFIX: ${{ vars.PLATFORM_RELAY_REDIS_KEY_PREFIX }}
          PLATFORM_RELAY_INSTANCE_ID: relay-validation
          PLATFORM_RELAY_CAPACITY_RETRY_AFTER_MS: '1000'
          PLATFORM_RELAY_DELIVERY_ACK_TIMEOUT_MS: '5000'
          PLATFORM_RELAY_DIRECTORY_TTL_MS: '60000'
          PLATFORM_RELAY_HEARTBEAT_TIMEOUT_MS: '45000'
          PLATFORM_RELAY_MAX_BUFFERED_CIPHERTEXT_BYTES: '1048576'
          PLATFORM_RELAY_MAX_CONNECTIONS: '10000'
          PLATFORM_RELAY_MAX_PENDING_DELIVERIES: '10000'
          PLATFORM_RELAY_MAX_PENDING_CHALLENGES: '10000'
          PLATFORM_RELAY_ATTACH_TIMEOUT_MS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_BLOB_BYTES: '104857600'
          PLATFORM_REMOTE_ATTACHMENT_CAPABILITY_LIFETIME_MS: '900000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_RETAINED_BLOBS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_STORAGE: ${{ inputs.attachment_storage }}
          PLATFORM_REMOTE_ATTACHMENT_SWEEP_INTERVAL_MS: '60000'
          PLATFORM_REMOTE_ATTACHMENT_CLEANUP_CONCURRENCY: '8'
          PLATFORM_TOKEN_SIGNING_KEY: ${{ secrets.PLATFORM_TOKEN_SIGNING_KEY }}
          PLATFORM_POLLING_SIGNING_KEY: ${{ secrets.PLATFORM_POLLING_SIGNING_KEY }}
          PLATFORM_ALIYUN_REGION: ${{ vars.PLATFORM_ALIYUN_REGION }}
          PLATFORM_ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.PLATFORM_ALIYUN_OIDC_PROVIDER_ARN }}
          PLATFORM_ALIYUN_DEPLOY_ROLE_ARN: ${{ vars.PLATFORM_ALIYUN_DEPLOY_ROLE_ARN }}
          PLATFORM_ECS_INSTANCE_IDS: ${{ vars.PLATFORM_ECS_INSTANCE_IDS }}
          PLATFORM_ALB_SERVER_GROUP_ID: ${{ vars.PLATFORM_ALB_SERVER_GROUP_ID }}
          PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT: ${{ vars.PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT }}
          PLATFORM_DEPLOY_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_DEPLOY_OSS_OBJECT_PREFIX }}
        run: node --import tsx/esm apps/platform/src/production-env-cli.ts

      - name: Reject simultaneous deploy and recovery
        env:
          DEPLOY: ${{ inputs.deploy }}
          RECOVER: ${{ inputs.recover }}
        run: |
          if [ "$DEPLOY" = true ] && [ "$RECOVER" = true ]; then
            echo 'platform: deploy and recover are mutually exclusive' >&2
            exit 1
          fi

      - name: Configure Alibaba Cloud OIDC credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.PLATFORM_ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.PLATFORM_ALIYUN_DEPLOY_ROLE_ARN }}
          role-session-name: gestalt-platform-validate-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Install pinned Alibaba Cloud CLI
        env:
          ARCHIVE: ${{ runner.temp }}/aliyun-cli.tgz
          BIN_DIR: ${{ runner.temp }}/aliyun-bin
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz" -o "$ARCHIVE"
          printf '%s  %s\n' "$ALIYUN_CLI_LINUX_AMD64_SHA256" "$ARCHIVE" | sha256sum -c -
          mkdir -p "$BIN_DIR"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Verify private ECS Cloud Assistant targets
        env:
          PLATFORM_ALIYUN_REGION: ${{ vars.PLATFORM_ALIYUN_REGION }}
          PLATFORM_ECS_INSTANCE_IDS: ${{ vars.PLATFORM_ECS_INSTANCE_IDS }}
          PLATFORM_ALB_SERVER_GROUP_ID: ${{ vars.PLATFORM_ALB_SERVER_GROUP_ID }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a instance_ids <<< "$PLATFORM_ECS_INSTANCE_IDS"
          response=$(aliyun ecs DescribeCloudAssistantStatus --region "$PLATFORM_ALIYUN_REGION" \
            --RegionId "$PLATFORM_ALIYUN_REGION" \
            --InstanceId.1 "${instance_ids[0]// /}" \
            --InstanceId.2 "${instance_ids[1]// /}")
          jq -e '.TotalCount == 2 and all(.InstanceCloudAssistantStatusSet.InstanceCloudAssistantStatus[]; .CloudAssistantStatus == "true")' \
            <<< "$response" >/dev/null
          server_group=$(aliyun alb ListServerGroupServers --region "$PLATFORM_ALIYUN_REGION" \
            --ServerGroupId "$PLATFORM_ALB_SERVER_GROUP_ID")
          jq -e --arg first "${instance_ids[0]// /}" --arg second "${instance_ids[1]// /}" \
            '.TotalCount == 2 and (.Servers | length) == 2 and ([.Servers[] | select(.Status == "Available" and .Port == 80) | .ServerId] | sort == ([$first, $second] | sort))' \
            <<< "$server_group" >/dev/null

  deploy:
    name: Deploy to private ECS through Cloud Assistant
    needs: validate
    if: ${{ inputs.deploy && !inputs.recover }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Alibaba Cloud CLI
        env:
          ARCHIVE: ${{ runner.temp }}/aliyun-cli.tgz
          BIN_DIR: ${{ runner.temp }}/aliyun-bin
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz" -o "$ARCHIVE"
          printf '%s  %s\n' "$ALIYUN_CLI_LINUX_AMD64_SHA256" "$ARCHIVE" | sha256sum -c -
          mkdir -p "$BIN_DIR"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and encrypt operated configuration
        env:
          TAG: ${{ inputs.image_tag }}
          DEPLOY_DIR: ${{ runner.temp }}/platform-deploy
          PLATFORM_ENVIRONMENT: production
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_GITHUB_CALLBACK: ${{ vars.PLATFORM_GITHUB_CALLBACK }}
          PLATFORM_GITHUB_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_CLIENT_ID }}
          PLATFORM_GITHUB_CLIENT_SECRET: ${{ secrets.PLATFORM_GITHUB_CLIENT_SECRET }}
          PLATFORM_GITHUB_CREDENTIAL_REFERENCE: ${{ vars.PLATFORM_GITHUB_CREDENTIAL_REFERENCE }}
          PLATFORM_POSTGRES_HOST: ${{ vars.PLATFORM_POSTGRES_HOST }}
          PLATFORM_POSTGRES_USER: ${{ secrets.PLATFORM_POSTGRES_USER }}
          PLATFORM_POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          PLATFORM_POSTGRES_SSL: require
          PLATFORM_POSTGRES_DATABASE: ${{ vars.PLATFORM_POSTGRES_DATABASE }}
          PLATFORM_IDENTITY_NAMESPACE: ${{ vars.PLATFORM_IDENTITY_NAMESPACE }}
          PLATFORM_REDIS_HOST: ${{ vars.PLATFORM_REDIS_HOST }}
          PLATFORM_REDIS_USER: ${{ secrets.PLATFORM_REDIS_USER }}
          PLATFORM_REDIS_PASSWORD: ${{ secrets.PLATFORM_REDIS_PASSWORD }}
          PLATFORM_REDIS_TLS: '1'
          PLATFORM_OSS_ENDPOINT: ${{ vars.PLATFORM_OSS_ENDPOINT }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_OSS_AUTH: ${{ vars.PLATFORM_OSS_AUTH }}
          PLATFORM_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_OSS_OBJECT_PREFIX }}
          PLATFORM_OSS_TIMEOUT_MS: '10000'
          PLATFORM_RELAY_REDIS_KEY_PREFIX: ${{ vars.PLATFORM_RELAY_REDIS_KEY_PREFIX }}
          PLATFORM_RELAY_CAPACITY_RETRY_AFTER_MS: '1000'
          PLATFORM_RELAY_DELIVERY_ACK_TIMEOUT_MS: '5000'
          PLATFORM_RELAY_DIRECTORY_TTL_MS: '60000'
          PLATFORM_RELAY_HEARTBEAT_TIMEOUT_MS: '45000'
          PLATFORM_RELAY_MAX_BUFFERED_CIPHERTEXT_BYTES: '1048576'
          PLATFORM_RELAY_MAX_CONNECTIONS: '10000'
          PLATFORM_RELAY_MAX_PENDING_DELIVERIES: '10000'
          PLATFORM_RELAY_MAX_PENDING_CHALLENGES: '10000'
          PLATFORM_RELAY_ATTACH_TIMEOUT_MS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_BLOB_BYTES: '104857600'
          PLATFORM_REMOTE_ATTACHMENT_CAPABILITY_LIFETIME_MS: '900000'
          PLATFORM_REMOTE_ATTACHMENT_MAX_RETAINED_BLOBS: '10000'
          PLATFORM_REMOTE_ATTACHMENT_STORAGE: ${{ inputs.attachment_storage }}
          PLATFORM_REMOTE_ATTACHMENT_SWEEP_INTERVAL_MS: '60000'
          PLATFORM_REMOTE_ATTACHMENT_CLEANUP_CONCURRENCY: '8'
          PLATFORM_TOKEN_SIGNING_KEY: ${{ secrets.PLATFORM_TOKEN_SIGNING_KEY }}
          PLATFORM_POLLING_SIGNING_KEY: ${{ secrets.PLATFORM_POLLING_SIGNING_KEY }}
          PLATFORM_SLS_ACCOUNT_ID: ${{ vars.PLATFORM_SLS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}/platform" | tr '[:upper:]' '[:lower:]'):${TAG}"
          docker pull "$image"
          docker save "$image" | gzip > "$DEPLOY_DIR/platform.tar.gz"
          config_container=$(docker create \
            -e PLATFORM_ENVIRONMENT -e PLATFORM_ORIGIN -e PLATFORM_GITHUB_CALLBACK \
            -e PLATFORM_GITHUB_CLIENT_ID -e PLATFORM_GITHUB_CLIENT_SECRET \
            -e PLATFORM_GITHUB_CREDENTIAL_REFERENCE -e PLATFORM_POSTGRES_HOST \
            -e PLATFORM_POSTGRES_USER -e PLATFORM_POSTGRES_PASSWORD -e PLATFORM_POSTGRES_SSL \
            -e PLATFORM_POSTGRES_DATABASE -e PLATFORM_IDENTITY_NAMESPACE -e PLATFORM_REDIS_HOST \
            -e PLATFORM_REDIS_USER -e PLATFORM_REDIS_PASSWORD -e PLATFORM_REDIS_TLS \
            -e PLATFORM_OSS_ENDPOINT -e PLATFORM_OSS_BUCKET -e PLATFORM_OSS_AUTH \
            -e PLATFORM_OSS_OBJECT_PREFIX -e PLATFORM_OSS_TIMEOUT_MS \
            -e PLATFORM_RELAY_REDIS_KEY_PREFIX -e PLATFORM_RELAY_CAPACITY_RETRY_AFTER_MS \
            -e PLATFORM_RELAY_DELIVERY_ACK_TIMEOUT_MS -e PLATFORM_RELAY_DIRECTORY_TTL_MS \
            -e PLATFORM_RELAY_HEARTBEAT_TIMEOUT_MS -e PLATFORM_RELAY_MAX_BUFFERED_CIPHERTEXT_BYTES \
            -e PLATFORM_RELAY_MAX_CONNECTIONS -e PLATFORM_RELAY_MAX_PENDING_DELIVERIES \
            -e PLATFORM_RELAY_MAX_PENDING_CHALLENGES -e PLATFORM_RELAY_ATTACH_TIMEOUT_MS \
            -e PLATFORM_REMOTE_ATTACHMENT_MAX_BLOB_BYTES \
            -e PLATFORM_REMOTE_ATTACHMENT_CAPABILITY_LIFETIME_MS \
            -e PLATFORM_REMOTE_ATTACHMENT_MAX_RETAINED_BLOBS -e PLATFORM_REMOTE_ATTACHMENT_STORAGE \
            -e PLATFORM_REMOTE_ATTACHMENT_SWEEP_INTERVAL_MS \
            -e PLATFORM_REMOTE_ATTACHMENT_CLEANUP_CONCURRENCY \
            -e PLATFORM_TOKEN_SIGNING_KEY -e PLATFORM_POLLING_SIGNING_KEY \
            -e PLATFORM_SLS_ACCOUNT_ID "$image")
          docker inspect "$config_container" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^PLATFORM_' > "$DEPLOY_DIR/platform.env"
          docker rm "$config_container" >/dev/null
          deploy_env_key=$(openssl rand -hex 32)
          echo "::add-mask::$deploy_env_key"
          DEPLOY_ENV_KEY="$deploy_env_key" openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$DEPLOY_DIR/platform.env" -out "$DEPLOY_DIR/platform.env.enc" -pass env:DEPLOY_ENV_KEY
          install -m 600 apps/platform/scripts/platform-host-deploy.sh "$DEPLOY_DIR/platform-host-deploy.sh"
          {
            printf 'IMAGE=%s\n' "$image"
            printf 'DEPLOY_ENV_KEY=%s\n' "$deploy_env_key"
            printf 'IMAGE_SHA256=%s\n' "$(sha256sum "$DEPLOY_DIR/platform.tar.gz" | cut -d ' ' -f 1)"
            printf 'ENV_SHA256=%s\n' "$(sha256sum "$DEPLOY_DIR/platform.env.enc" | cut -d ' ' -f 1)"
            printf 'SCRIPT_SHA256=%s\n' "$(sha256sum "$DEPLOY_DIR/platform-host-deploy.sh" | cut -d ' ' -f 1)"
          } >> "$GITHUB_ENV"

      - name: Configure fresh Alibaba Cloud OIDC credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.PLATFORM_ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.PLATFORM_ALIYUN_DEPLOY_ROLE_ARN }}
          role-session-name: gestalt-platform-deploy-${{ github.run_id }}
          role-session-expiration: 21600
          audience: sts.aliyuncs.com

      - name: Stage artifacts and deploy through private control plane
        env:
          DEPLOY_DIR: ${{ runner.temp }}/platform-deploy
          PLATFORM_ALIYUN_REGION: ${{ vars.PLATFORM_ALIYUN_REGION }}
          PLATFORM_ECS_INSTANCE_IDS: ${{ vars.PLATFORM_ECS_INSTANCE_IDS }}
          PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
          PLATFORM_OSS_ENDPOINT: ${{ vars.PLATFORM_OSS_ENDPOINT }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT: ${{ vars.PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT }}
          PLATFORM_DEPLOY_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_DEPLOY_OSS_OBJECT_PREFIX }}
          PLATFORM_REMOTE_ATTACHMENT_STORAGE: ${{ inputs.attachment_storage }}
        run: |
          set -eEuo pipefail
          source apps/platform/scripts/platform-cloud-assistant.sh
          source apps/platform/scripts/platform-public-readiness.sh
          IFS=',' read -r -a instance_ids <<< "$PLATFORM_ECS_INSTANCE_IDS"
          for index in "${!instance_ids[@]}"; do
            instance_ids[index]="${instance_ids[index]// /}"
          done
          object_root="${PLATFORM_DEPLOY_OSS_OBJECT_PREFIX}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_object="oss://${PLATFORM_OSS_BUCKET}/${object_root}/platform.tar.gz"
          env_object="oss://${PLATFORM_OSS_BUCKET}/${object_root}/platform.env.enc"
          script_object="oss://${PLATFORM_OSS_BUCKET}/${object_root}/platform-host-deploy.sh"
          state_object="oss://${PLATFORM_OSS_BUCKET}/${PLATFORM_DEPLOY_OSS_OBJECT_PREFIX}/active-state.json"
          state_file="$DEPLOY_DIR/active-state.json"
          state_resolved=0
          cleanup_artifacts() {
            set +e
            aliyun oss rm "$image_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force >/dev/null 2>&1
            aliyun oss rm "$env_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force >/dev/null 2>&1
            aliyun oss rm "$script_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force >/dev/null 2>&1
            if [ "$state_resolved" = 1 ]; then
              aliyun oss rm "$state_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force >/dev/null 2>&1
            fi
          }
          trap cleanup_artifacts EXIT
          set +e
          state_probe=$(aliyun oss cat "$state_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" 2>&1)
          state_probe_status=$?
          set -e
          if [ "$state_probe_status" = 0 ]; then
            echo 'platform: an unresolved deployment exists; dispatch recover before deploying again' >&2
            exit 1
          elif ! grep -Fq 'StatusCode=404' <<< "$state_probe"; then
            echo 'platform: failed to determine whether an unresolved deployment exists' >&2
            exit 1
          fi
          aliyun oss cp "$DEPLOY_DIR/platform.tar.gz" "$image_object" \
            --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force
          aliyun oss cp "$DEPLOY_DIR/platform.env.enc" "$env_object" \
            --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force
          aliyun oss cp "$DEPLOY_DIR/platform-host-deploy.sh" "$script_object" \
            --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force
          image_url=$(aliyun oss sign "$image_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_OSS_ENDPOINT" --timeout 21600 | head -1)
          env_url=$(aliyun oss sign "$env_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_OSS_ENDPOINT" --timeout 21600 | head -1)
          script_url=$(aliyun oss sign "$script_object" --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_OSS_ENDPOINT" --timeout 21600 | head -1)
          echo "::add-mask::$image_url"
          echo "::add-mask::$env_url"
          echo "::add-mask::$script_url"
          write_deploy_state() {
            instance_ids_json=$(printf '%s\n' "${instance_ids[@]}" | jq -R . | jq -s .)
            jq -nc --arg phase "$1" --arg objectRoot "$object_root" --argjson instanceIds "$instance_ids_json" \
              '{version:1, phase:$phase, objectRoot:$objectRoot, instanceIds:$instanceIds}' > "$state_file"
            aliyun oss cp "$state_file" "$state_object" \
              --region "$PLATFORM_ALIYUN_REGION" --endpoint "$PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT" --force >/dev/null
          }
          write_deploy_state rollbackable

          remote_action() {
            local instance_id="$1" relay_instance="$2" action="$3"
            local wrapper="$DEPLOY_DIR/cloud-command.sh"
            install -m 600 /dev/null "$wrapper"
            {
              echo 'set -eEuo pipefail'
              echo 'umask 077'
              # shellcheck disable=SC2016
              printf 'workdir=$(mktemp -d /run/dsh-platform-command.XXXXXX)\n'
              # shellcheck disable=SC2016
              echo 'cleanup_command() { find "$workdir" -type f -delete; rmdir "$workdir"; }'
              # shellcheck disable=SC2016
              echo 'trap cleanup_command EXIT'
              # shellcheck disable=SC2016
              printf 'curl --proto "=https" --tlsv1.2 -fsS %q -o "$workdir/platform-host-deploy.sh"\n' "$script_url"
              # shellcheck disable=SC2016
              printf 'printf "%%s  %%s\\n" %q "$workdir/platform-host-deploy.sh" | sha256sum -c -\n' "$SCRIPT_SHA256"
              printf 'export DSH_DEPLOY_IMAGE_URL=%q\n' "$image_url"
              printf 'export DSH_DEPLOY_IMAGE_SHA256=%q\n' "$IMAGE_SHA256"
              printf 'export DSH_DEPLOY_ENV_URL=%q\n' "$env_url"
              printf 'export DSH_DEPLOY_ENV_SHA256=%q\n' "$ENV_SHA256"
              printf 'export DSH_DEPLOY_ENV_KEY=%q\n' "$DEPLOY_ENV_KEY"
              printf 'export DSH_DEPLOY_IMAGE=%q\n' "$IMAGE"
              printf 'export DSH_DEPLOY_STORAGE=%q\n' "$PLATFORM_REMOTE_ATTACHMENT_STORAGE"
              printf 'export DSH_RELAY_INSTANCE_ID=%q\n' "$relay_instance"
              # shellcheck disable=SC2016
              printf 'bash "$workdir/platform-host-deploy.sh" %q\n' "$action"
            } > "$wrapper"
            if [ "$action" = prepare ]; then
              platform_cloud_run "$instance_id" "$wrapper" 1800
            elif [ "$action" = rollback ]; then
              platform_cloud_run "$instance_id" "$wrapper" 2100
            else
              platform_cloud_run "$instance_id" "$wrapper" 300
            fi
          }

          rollback_platform() (
            set +e
            local rollback_failed=0 index
            for index in "${!instance_ids[@]}"; do
              remote_action "${instance_ids[$index]}" "relay-$((index + 1))" rollback || rollback_failed=1
            done
            exit "$rollback_failed"
          )
          on_deploy_error() {
            local status=$?
            trap - ERR INT TERM
            if rollback_platform; then
              state_resolved=1
            else
              echo 'platform: one or more instances failed to restore the predecessor' >&2
            fi
            exit "$status"
          }
          on_deploy_interrupt() {
            local status="$1"
            trap - ERR INT TERM
            if rollback_platform; then
              state_resolved=1
            else
              echo 'platform: one or more instances failed to restore the predecessor' >&2
            fi
            exit "$status"
          }
          trap on_deploy_error ERR
          trap 'on_deploy_interrupt 130' INT
          trap 'on_deploy_interrupt 143' TERM

          for index in "${!instance_ids[@]}"; do
            remote_action "${instance_ids[$index]}" "relay-$((index + 1))" prepare
          done
          for index in "${!instance_ids[@]}"; do
            remote_action "${instance_ids[$index]}" "relay-$((index + 1))" verify-predecessor
          done
          for index in "${!instance_ids[@]}"; do
            echo "rolling replacement keeps the other private ECS instance serving: ${instance_ids[$index]}"
            remote_action "${instance_ids[$index]}" "relay-$((index + 1))" replace
          done

          platform_public_readiness 30
          write_deploy_state commit-pending
          trap - ERR INT TERM

          rollback_cleanup_failed=0
          for index in "${!instance_ids[@]}"; do
            remote_action "${instance_ids[$index]}" "relay-$((index + 1))" cleanup-rollback \
              || rollback_cleanup_failed=1
          done
          if [ "$rollback_cleanup_failed" != 0 ]; then
            exit 1
          fi

          remote_action "${instance_ids[0]}" relay-1 cutover
          write_deploy_state committed
          finalize_failed=0
          for index in "${!instance_ids[@]}"; do
            remote_action "${instance_ids[$index]}" "relay-$((index + 1))" finalize || finalize_failed=1
          done
          test "$finalize_failed" = 0
          state_resolved=1

  recover:
    name: Resolve an interrupted private ECS deployment
    needs: validate
    if: ${{ inputs.recover }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Alibaba Cloud OIDC credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.PLATFORM_ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.PLATFORM_ALIYUN_DEPLOY_ROLE_ARN }}
          role-session-name: gestalt-platform-recover-${{ github.run_id }}
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: Install pinned Alibaba Cloud CLI
        env:
          ARCHIVE: ${{ runner.temp }}/aliyun-cli.tgz
          BIN_DIR: ${{ runner.temp }}/aliyun-bin
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz" -o "$ARCHIVE"
          printf '%s  %s\n' "$ALIYUN_CLI_LINUX_AMD64_SHA256" "$ARCHIVE" | sha256sum -c -
          mkdir -p "$BIN_DIR"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Resolve every instance from the durable phase
        env:
          PLATFORM_ALIYUN_REGION: ${{ vars.PLATFORM_ALIYUN_REGION }}
          PLATFORM_ECS_INSTANCE_IDS: ${{ vars.PLATFORM_ECS_INSTANCE_IDS }}
          PLATFORM_OSS_BUCKET: ${{ vars.PLATFORM_OSS_BUCKET }}
          PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT: ${{ vars.PLATFORM_DEPLOY_OSS_UPLOAD_ENDPOINT }}
          PLATFORM_DEPLOY_OSS_OBJECT_PREFIX: ${{ vars.PLATFORM_DEPLOY_OSS_OBJECT_PREFIX }}
          RECOVERY_COMMAND: ${{ runner.temp }}/platform-recovery.sh
        run: |
          bash apps/platform/scripts/platform-recover.sh
