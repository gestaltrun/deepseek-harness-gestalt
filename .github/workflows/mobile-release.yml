name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed master commit to build and sign.
        required: true
        type: string
      acceptance_run_id:
        description: Successful Mobile Companion Acceptance run for this exact candidate.
        required: true
        type: string
      upload_testflight:
        description: Upload the signed iOS candidate to TestFlight.
        required: true
        type: boolean
        default: false
      accept_transport_risk:
        description: Accept the reviewed Companion transport test evidence without an external security review for this candidate.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  release-authorization:
    name: Verify candidate-bound release evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact master candidate
        env:
          MOBILE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MOBILE_CANDIDATE_SHA"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse refs/remotes/origin/master)" = "$MOBILE_CANDIDATE_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify immutable Companion acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          MOBILE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MOBILE_TRANSPORT_RISK_ACCEPTED: ${{ inputs.accept_transport_risk }}
        run: |
          pnpm exec tsx apps/mobile/scripts/verify-companion-release-evidence.ts \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$MOBILE_ACCEPTANCE_RUN_ID" \
            --candidate-sha "$MOBILE_CANDIDATE_SHA" \
            --transport-risk-accepted "$MOBILE_TRANSPORT_RISK_ACCEPTED" \
            --test-flight true \
            --android-apk true

  android:
    name: Signed Android APK
    needs: release-authorization
    if: github.ref == 'refs/heads/master' && needs.release-authorization.result == 'success'
    runs-on: ubuntu-24.04
    environment: mobile-release
    env:
      MOBILE_VERSION: ${{ vars.MOBILE_VERSION }}
      MOBILE_BUILD_NUMBER: ${{ vars.MOBILE_BUILD_NUMBER }}
      VITE_PLATFORM_ORIGIN: ${{ vars.VITE_PLATFORM_ORIGIN }}
      VITE_PLATFORM_CALLBACK_URL: ${{ vars.VITE_PLATFORM_CALLBACK_URL }}
      VITE_PLATFORM_GITHUB_CLIENT_ID: ${{ vars.VITE_PLATFORM_GITHUB_CLIENT_ID }}
      VITE_PLATFORM_CREDENTIAL_REFERENCE: ${{ vars.VITE_PLATFORM_CREDENTIAL_REFERENCE }}
      VITE_PLATFORM_DATABASE_IDENTITY: ${{ vars.VITE_PLATFORM_DATABASE_IDENTITY }}
      VITE_PLATFORM_IDENTITY_NAMESPACE: ${{ vars.VITE_PLATFORM_IDENTITY_NAMESPACE }}
      VITE_REMOTE_RELAY_WSS_URL: ${{ vars.VITE_REMOTE_RELAY_WSS_URL }}
      VITE_REMOTE_RELAY_ATTACH_TIMEOUT_MS: ${{ vars.VITE_REMOTE_RELAY_ATTACH_TIMEOUT_MS }}
      VITE_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS: ${{ vars.VITE_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS }}
      VITE_REMOTE_RELAY_RECONNECT_DELAY_MS: ${{ vars.VITE_REMOTE_RELAY_RECONNECT_DELAY_MS }}
      VITE_REMOTE_RELAY_INBOUND_MAX_BYTES: ${{ vars.VITE_REMOTE_RELAY_INBOUND_MAX_BYTES }}
      VITE_REMOTE_RELAY_INBOUND_MAX_MESSAGES: ${{ vars.VITE_REMOTE_RELAY_INBOUND_MAX_MESSAGES }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact master candidate
        env:
          MOBILE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MOBILE_CANDIDATE_SHA"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse refs/remotes/origin/master)" = "$MOBILE_CANDIDATE_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash apps/mobile/scripts/build-android-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-gestalt-android-${{ vars.MOBILE_VERSION }}-${{ vars.MOBILE_BUILD_NUMBER }}
          path: apps/mobile/release/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Signed iOS and TestFlight
    needs: release-authorization
    if: github.ref == 'refs/heads/master' && needs.release-authorization.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, mobile-release]
    environment: mobile-release
    env:
      MOBILE_BUNDLE_ID: ${{ vars.MOBILE_BUNDLE_ID }}
      MOBILE_VERSION: ${{ vars.MOBILE_VERSION }}
      MOBILE_BUILD_NUMBER: ${{ vars.MOBILE_BUILD_NUMBER }}
      MOBILE_PROVISIONING_PROFILE: Gestalt Mobile App Store
      VITE_PLATFORM_ORIGIN: ${{ vars.VITE_PLATFORM_ORIGIN }}
      VITE_PLATFORM_CALLBACK_URL: ${{ vars.VITE_PLATFORM_CALLBACK_URL }}
      VITE_PLATFORM_GITHUB_CLIENT_ID: ${{ vars.VITE_PLATFORM_GITHUB_CLIENT_ID }}
      VITE_PLATFORM_CREDENTIAL_REFERENCE: ${{ vars.VITE_PLATFORM_CREDENTIAL_REFERENCE }}
      VITE_PLATFORM_DATABASE_IDENTITY: ${{ vars.VITE_PLATFORM_DATABASE_IDENTITY }}
      VITE_PLATFORM_IDENTITY_NAMESPACE: ${{ vars.VITE_PLATFORM_IDENTITY_NAMESPACE }}
      VITE_REMOTE_RELAY_WSS_URL: ${{ vars.VITE_REMOTE_RELAY_WSS_URL }}
      VITE_REMOTE_RELAY_ATTACH_TIMEOUT_MS: ${{ vars.VITE_REMOTE_RELAY_ATTACH_TIMEOUT_MS }}
      VITE_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS: ${{ vars.VITE_REMOTE_RELAY_HEARTBEAT_INTERVAL_MS }}
      VITE_REMOTE_RELAY_RECONNECT_DELAY_MS: ${{ vars.VITE_REMOTE_RELAY_RECONNECT_DELAY_MS }}
      VITE_REMOTE_RELAY_INBOUND_MAX_BYTES: ${{ vars.VITE_REMOTE_RELAY_INBOUND_MAX_BYTES }}
      VITE_REMOTE_RELAY_INBOUND_MAX_MESSAGES: ${{ vars.VITE_REMOTE_RELAY_INBOUND_MAX_MESSAGES }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact master candidate
        env:
          MOBILE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MOBILE_CANDIDATE_SHA"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse refs/remotes/origin/master)" = "$MOBILE_CANDIDATE_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build signed App Store candidate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash apps/mobile/scripts/build-ios-release.sh
      - name: Upload TestFlight
        if: inputs.upload_testflight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH="$(find apps/mobile/release -maxdepth 1 -name '*.ipa' -print -quit)" \
            bash apps/mobile/scripts/upload-testflight.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-gestalt-ios-${{ vars.MOBILE_VERSION }}-${{ vars.MOBILE_BUILD_NUMBER }}
          path: apps/mobile/release/*.ipa
          if-no-files-found: error
          retention-days: 30
